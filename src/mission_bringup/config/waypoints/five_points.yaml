# five_points.yaml —— 5 路点巡航任务（坐标由 maps/lab_5x5.pgm 实测计算）
#
# 坐标来源（2026-11 定稿）：
#   地图 lab_5x5.pgm 174x253 px，resolution 0.05，origin [-2.643, -5.014, 0]
#   选点方法：自由空间中距最近障碍 >=0.30m 的格子做最远点采样（点间距优先 +
#   安全余量加权），再按近邻序排巡检顺序，yaw 朝向下一目标点。
#   各点离障碍实测：wp1 1.10m / wp5 0.35m / wp3 0.75m / wp2 0.80m / wp4 0.40m。
#
# 换算公式（如需手算复核）：
#   x = origin_x + (px + 0.5) * 0.05
#   y = origin_y + (H - py - 0.5) * 0.05      # PGM 行 0 在顶部，y 轴翻转
#
# 注意：inflation_radius=0.45，wp5/wp4 余量偏紧（0.35/0.40m），
# 若实车蹭墙或局部规划绕远，把这两点朝障碍反方向挪 0.1~0.2m，或在 RViz
# 用 Publish Point 工具重取（话题 /clicked_point）。

mission:
  name: "five_points"
  loop: false
  max_retries: 2
  skip_on_fail: true
  goal_timeout_sec: 60.0

waypoints:
  - id: "wp1"
    pose: {x: 1.432, y: -0.239, yaw: -0.228}
    action: "navigate"
    xy_tolerance: 0.10
    yaw_tolerance: 0.08
  - id: "wp5"
    pose: {x: 4.232, y: -0.889, yaw: 2.087}
    action: "navigate"
  - id: "wp3"
    pose: {x: 2.132, y: 2.811, yaw: 1.264}
    action: "navigate"
  - id: "wp2"
    pose: {x: 3.082, y: 5.811, yaw: -1.950}
    action: "navigate"
  - id: "wp4"
    pose: {x: -0.468, y: -3.089, yaw: 0.983}
    action: "navigate"
